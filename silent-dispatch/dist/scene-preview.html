<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home by Christmas — Scene review</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="style.css"></head>
<body class="preview-page">
<header class="preview-heading"><h1>Home by Christmas</h1><p>Scene review · Breakfast is an animation preview; scenes 2–6 await animation. Sound is pending.</p><a href="index.html">Back to newspaper</a></header>
<main id="preview-stage" aria-label="Scene review player"></main>
<p id="review-complete" hidden>Sequence finished. <button id="replay" type="button">Replay</button></p>
<script type="module">
import {playScene} from './scene.js';
const stage=document.querySelector('#preview-stage');
const completed=document.querySelector('#review-complete');
const params=new URLSearchParams(location.search);
async function play() {
  completed.hidden=true;
  await playScene(stage,{review:true,initialScene:params.get('scene') ?? 1,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
  completed.hidden=false;document.querySelector('#replay').focus();
}
document.querySelector('#replay').addEventListener('click',play);
play();
</script></body></html>
